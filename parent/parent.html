<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Visual Agenda</title>
    <link rel="stylesheet" href="parent_style.css">
    <link rel="stylesheet" href="../src\css\grid_styles.css">
</head>
<body>
    <header class="header">
        <h1>Daily Visual Agenda</h1>
        <div class="btn-placement">
            <!--Adding buttons for each calendar view-->
            <button id="morningBtn" class="toggle-btn active">Morning</button>
            <button id="afternoonBtn" class="toggle-btn active">Afternoon</button> 
            <button id="eveBtn" class="toggle-btn active">Evening</button>
            <button id="nightBtn" class="toggle-btn active">Night</button>
        </div>
        <div class="btn-placement">
            <button id="adminviewbutton" class="button">🔓Admin</button>
            <input type="password" id="passCodeInput" placeholder="Enter passcode to exit">
            
            <button id="childviewbutton" class="button">Child</button>
            <button id="settingsbutton" class="button">Settings</button>
        </div>
    </header>

    <div id="AB">

    <div id="search-side">
        <h2 id="search-title">Search for images</h2>

        <form id="filter-form" class="search-box">
            <input
                type="text"
                id="filter-input"
                placeholder="Search images..."
            >
            <button class="submit-btn" type="submit">Search</button>
        </form>

        <main class="container">
            <div id="image-grid" class="image-grid"></div>
            <p id="empty-message" hidden>No images found.</p>
        </main>
    </div>
    
        <div id="container-for-calendars" class="container-for-calendars">
            <div id="calendar-container"></div>
            <br>
            <div id="calendar-container2"></div>
            <br>
            <div id="calendar-container3"></div>
            <br>
            <div id="calendar-container4"></div>
        </div>
    </div>



    <script src="toggleviews.js"></script>
    <script src="../src/Child/calendarData.js"></script>
    <script src="../src/jsonhandler.js"></script>
        

    <script src="../src/Child/calendar.js"></script>
    <script src="../src/cellselection.js"></script>

    <script src="parent_script.js"></script>    
    
</body>
</html>
