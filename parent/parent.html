<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Visual Agenda</title>
    <link rel="stylesheet" href="parent_style.css">
    <link rel="stylesheet" href="../src\css\settings_styles.css">
    <link rel="stylesheet" href="../src\css\grid_styles.css">
</head>
<body>
    <header class="header">
        <h1>Daily Visual Agenda</h1>
        <button id="adminviewbutton" class="button">🔓Admin</button>
        <input type="password" id="passCodeInput" placeholder="Enter passcode to exit">
        
        <button id="childviewbutton" class="button">Child</button>
        <button id="settingsbutton" class="button">🔓Settings</button>
        
    </header>

    <div id="settings-container" style="display: none;">
            <div id="closesettingsbuttoncontainer"><button id="closesettingsbutton">X</button></div>
            <h2 id="settingstitle">Settings</h2>
            <hr>
            <div id="calendarbuttons">
                <button id="savebutton" class="button">Save calendar</button>
                <button id="loadbutton" class="button">Load calendar</button>
                <button id="newbutton" class="button">New calendar</button>
            </div>
            <hr>
            <div id="settings-passcode">
                <div class="passcodecontainer">
                    <p>Old passcode: </p><input type="password" id="oldpasscode" class="passcodeinputs">
                </div>
                <div class="passcodecontainer">
                    <p>New passcode: </p><input type="password" id="newpasscode" class="passcodeinputs">
                </div>
                <button id="passcodesavebutton">Save passcode</button>
            </div>
            <p id="invalidpasscode-message" style="color: red; margin: 0px;" hidden>Invalid passcode!</p>
            <p id="updatedpasscode-message" style="margin: 0px;" hidden>Passcode updated.</p>
    </div>

    <div id="AB">

    <div id="search-side">
        <h2>Search for images</h2>

        <!--<form id="search-form" class="search-box">
            <input
                type="text"
                id="search-input"
                placeholder="Search images..."
            >
            <button type="submit">Search</button>
        </form>-->
        <form id="filter-form" class="search-box">
            <input
                type="text"
                id="filter-input"
                placeholder="Filter images..."
            >
            <button class="submit-btn" type="submit">Filter</button>
        </form>

        <main class="container">
            <div id="image-grid" class="image-grid"></div>
            <p id="empty-message" hidden>No images found.</p>
        </main>
    </div>
    
        <div id="container-for-calendars" class="container-for-calendars">
            <div id="calendar-container" class="calendarclass"></div>
            <br>
            <div id="calendar-container2" class="calendarclass"></div>
            <br>
            <div id="calendar-container3" class="calendarclass"></div>
            <br>
            <div id="calendar-container4" class="calendarclass"></div>
        </div>
    </div>



    <script src="toggleviews.js"></script>
    <script src="../src/Child/calendarData.js"></script>
    <script src="../src/jsonhandler.js"></script>
        

    <script src="../src/Child/calendar.js"></script>
    <script src="../src/cellselection.js"></script>

    <script src="parent_script.js"></script>    
    
    <script src="../src/settings.js"></script>
</body>
</html>
